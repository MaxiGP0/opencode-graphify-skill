name: CI

on:
  push:
  pull_request:

jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash install.sh --dir "$RUNNER_TEMP/opencode-skills" --skip-cli

      - name: Verify (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash verify.sh --dir "$RUNNER_TEMP/opencode-skills"

      - name: Install (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./install.ps1 -SkillDir "$env:RUNNER_TEMP/opencode-skills" -SkipCli

      - name: Verify (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./verify.ps1 -SkillDir "$env:RUNNER_TEMP/opencode-skills"

  cli:
    name: CLI (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install graphifyy
        run: python -m pip install --upgrade pip graphifyy

      - name: Check the CLI
        run: |
          graphify --version
          graphify --help

      - name: Install the skill
        run: bash install.sh --dir "$RUNNER_TEMP/opencode-skills" --skip-cli

      - name: Verify with the CLI required
        run: bash verify.sh --dir "$RUNNER_TEMP/opencode-skills" --require-cli
